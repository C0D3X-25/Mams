name: Build and Release

on:
  push: 
    tags: 
      - 'v*'  # Triggers on v1.0.0, v1.2.3, etc.

jobs:
  build-and-release: 
    runs-on:  windows-latest
    
    steps: 
      - name:  Checkout source code
        uses:  actions/checkout@v4
      
      - name:  Setup .NET
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '9.0.x'
      
      - name:  Restore dependencies
        run: dotnet restore
      
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name:  Build and Publish
        run:  |
          dotnet publish -c Release -r win-x64 --self-contained true -p: PublishSingleFile=true -p: IncludeNativeLibrariesForSelfExtract=true -o ./publish
      
      - name:  Rename executable with version
        shell: pwsh
        run:  |
          Rename-Item -Path "./publish/Mams.exe" -NewName "Mams-v${{ steps.version.outputs.VERSION }}.exe"
      
      - name:  Create Release in Mams-Releases repo
        uses: softprops/action-gh-release@v2
        with: 
          repository: C0D3X-25/Mams-Releases
          tag_name: v${{ steps.version.outputs.VERSION }}
          name:  Mams v${{ steps.version.outputs.VERSION }}
          generate_release_notes:  false
          body: |
            ## Mams v${{ steps.version.outputs.VERSION }}
            
            ### Installation
            1. Download `Mams-v${{ steps. version.outputs.VERSION }}.exe` below
            2. Run the executable
            
            ### What's Changed
            See the [commit history](https://github.com/C0D3X-25/Mams/commits/v${{ steps.version.outputs. VERSION }}) for details.
          files: |
            ./publish/Mams-v${{ steps.version.outputs. VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}