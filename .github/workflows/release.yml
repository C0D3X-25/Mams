name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  GITHUB_REPO: C0D3X-25/Mams

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "push") {
          $version = "${{ github.ref_name }}".TrimStart('v')
        } else {
          $version = "${{ github.event.inputs.version }}"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"

    - name: Restore dependencies
      run: dotnet restore Mams_App/Mams_App.csproj

    - name: Publish ClickOnce application
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $updateUrl = "https://github.com/${{ env.GITHUB_REPO }}/releases/latest/download/"
        
        dotnet publish Mams_App/Mams_App.csproj `
          -c Release `
          -p:PublishProfile=ClickOnceProfile `
          -p:ApplicationVersion=$version.0 `
          -p:PublishUrl=$updateUrl `
          -p:InstallUrl=$updateUrl `
          -p:UpdateUrl=$updateUrl `
          -p:PublishDir="${{ github.workspace }}/publish/"

    - name: Create setup.exe bootstrapper
      shell: pwsh
      run: |
        # Create a simple PowerShell installer script that users can run
        $installerScript = @'
        # Mams Installer Script
        $ErrorActionPreference = "Stop"
        
        Write-Host "Downloading Mams..." -ForegroundColor Cyan
        $appUrl = "https://github.com/${{ env.GITHUB_REPO }}/releases/latest/download/Mams_App.application"
        $tempPath = "$env:TEMP\Mams_App.application"
        
        Invoke-WebRequest -Uri $appUrl -OutFile $tempPath
        
        Write-Host "Launching installer..." -ForegroundColor Cyan
        Start-Process $tempPath
        
        Write-Host "Installation started!" -ForegroundColor Green
        '@
        
        $installerScript | Out-File -FilePath "${{ github.workspace }}/Install-Mams.ps1" -Encoding UTF8

    - name: Prepare ClickOnce files for release
      id: clickonce
      shell: pwsh
      run: |
        $publishDir = "${{ github.workspace }}/publish"
        $releaseDir = "${{ github.workspace }}/release"
        
        New-Item -ItemType Directory -Force -Path $releaseDir
        
        # Copy the .application manifest (main entry point)
        $appManifest = Get-ChildItem -Path $publishDir -Filter "*.application" -Recurse | Select-Object -First 1
        if ($appManifest) {
          Copy-Item $appManifest.FullName -Destination $releaseDir
          echo "APP_MANIFEST=$($appManifest.Name)" >> $env:GITHUB_OUTPUT
        }
        
        # Create ZIP of all ClickOnce files
        Compress-Archive -Path "$publishDir/*" -DestinationPath "$releaseDir/Mams_v${{ steps.version.outputs.VERSION }}_ClickOnce.zip"
        
        # List what we're publishing
        Write-Host "Files to release:"
        Get-ChildItem $releaseDir | ForEach-Object { Write-Host "  - $($_.Name)" }

    - name: Publish portable application
      shell: pwsh
      run: |
        dotnet publish Mams_App/Mams_App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:UseAppHost=true `
          -p:PublishProtocol= `
          -p:Version=${{ steps.version.outputs.VERSION }} `
          -p:PublishDir=${{ github.workspace }}/portable

    - name: Create portable ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path ./portable/* -DestinationPath ./release/Mams_v${{ steps.version.outputs.VERSION }}_Portable.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
        name: Mams v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: |
          ./release/*
          ./publish/*.application
          ./publish/Application Files/**/*
          ./Install-Mams.ps1
        body: |
          ## Mams v${{ steps.version.outputs.VERSION }}
          
          ### Installation Options
          
          **ClickOnce Installer (Recommended - Auto-Updates!):**
          1. Download `Mams_App.application`
          2. Double-click to install
          3. The app will automatically check for updates on each launch
          
          > ?? **First-time install:** Windows SmartScreen may show a warning. Click "More info" ? "Run anyway"
          
          **Portable Version (No Install):**
          - Download `Mams_v${{ steps.version.outputs.VERSION }}_Portable.zip`
          - Extract to any folder
          - Run `Mams_App.exe`
          - Note: Portable version does NOT auto-update
          
          ### Auto-Update
          The ClickOnce version automatically checks for updates when you launch the app. 
          Updates are downloaded and installed seamlessly.
          
          ### Requirements
          - Windows 10 or later (64-bit)
          - No .NET installation required (runtime is included)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
