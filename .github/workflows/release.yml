name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "push") {
          $version = "${{ github.ref_name }}".TrimStart('v')
        } else {
          $version = "${{ github.event.inputs.version }}"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"

    - name: Restore dependencies
      run: dotnet restore Mams_App/Mams_App.csproj

    - name: Publish application (self-contained)
      shell: pwsh
      run: |
        dotnet publish Mams_App/Mams_App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:UseAppHost=true `
          -p:Version=${{ steps.version.outputs.VERSION }} `
          -p:PublishDir=${{ github.workspace }}/publish

    - name: Download Inno Setup
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "innosetup.exe"
        Start-Process -FilePath "innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait

    - name: Create installer with Inno Setup
      shell: pwsh
      run: |
        $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
        iscc.exe /DAppVersion="${{ steps.version.outputs.VERSION }}" installer/MamsSetup.iss

    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Mams_v${{ steps.version.outputs.VERSION }}_Portable.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
        name: Mams v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: |
          ./installer/Output/MamsSetup_v${{ steps.version.outputs.VERSION }}.exe
          ./Mams_v${{ steps.version.outputs.VERSION }}_Portable.zip
        body: |
          ## Mams v${{ steps.version.outputs.VERSION }}
          
          ### Installation Options
          
          **Installer (Recommended):**
          - Download `MamsSetup_v${{ steps.version.outputs.VERSION }}.exe`
          - Run the installer and follow the prompts
          - The app will be installed to your Program Files and added to Start Menu
          
          **Portable Version:**
          - Download `Mams_v${{ steps.version.outputs.VERSION }}_Portable.zip`
          - Extract to any folder
          - Run `Mams_App.exe`
          
          ### Requirements
          - Windows 10 or later (64-bit)
          - No .NET installation required (runtime is included)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
