name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

# Required permissions for creating releases
permissions:
  contents: write

env:
  GITHUB_REPO: C0D3X-25/Mams

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "push") {
          $version = "${{ github.ref_name }}".TrimStart('v')
        } else {
          $version = "${{ github.event.inputs.version }}"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"

    - name: Restore dependencies
      run: dotnet restore Mams_App/Mams_App.csproj

    - name: Build and publish application
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        
        # Build the application
        dotnet publish Mams_App/Mams_App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:UseAppHost=true `
          -p:Version=$version `
          -p:PublishDir="${{ github.workspace }}/publish/"

    - name: Create release directory
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/release"

    - name: Create ClickOnce ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path "${{ github.workspace }}/publish/*" -DestinationPath "${{ github.workspace }}/release/Mams_v${{ steps.version.outputs.VERSION }}_ClickOnce.zip"

    - name: Publish portable application
      shell: pwsh
      run: |
        dotnet publish Mams_App/Mams_App.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:UseAppHost=true `
          -p:Version=${{ steps.version.outputs.VERSION }} `
          -p:PublishDir=${{ github.workspace }}/portable

    - name: Create portable ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path ./portable/* -DestinationPath ./release/Mams_v${{ steps.version.outputs.VERSION }}_Portable.zip

    - name: List release files
      shell: pwsh
      run: |
        Write-Host "Files to release:"
        Get-ChildItem "${{ github.workspace }}/release" | ForEach-Object { Write-Host "  - $($_.Name)" }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
        name: Mams v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: |
          ./release/*
        body: |
          ## Mams v${{ steps.version.outputs.VERSION }}
          
          ### Installation Options
          
          **Application ZIP (Recommended):**
          - Download `Mams_v${{ steps.version.outputs.VERSION }}_ClickOnce.zip`
          - Extract to any folder
          - Run `Mams_App.exe`
          
          **Portable Version:**
          - Download `Mams_v${{ steps.version.outputs.VERSION }}_Portable.zip`
          - Extract to any folder
          - Run `Mams_App.exe`
          
          > ?? **First-time run:** Windows SmartScreen may show a warning. Click "More info" ? "Run anyway"
          
          ### Requirements
          - Windows 10 or later (64-bit)
          - No .NET installation required (runtime is included)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
