name: Build and Publish MSIX

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    runs-on: windows-latest
    
    env:
      Solution_Name: Mams.sln
      Wap_Project_Directory: Mams_Installerr
      Wap_Project_Path: Mams_Installerr\Mams_Installerr.wapproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    - name: Build MSIX Package (Sideload)
      run: |
        msbuild ${{ env.Wap_Project_Path }} /p:Configuration=Release /p:Platform=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false

    - name: Upload MSIX Package
      uses: actions/upload-artifact@v4
      with:
        name: MSIX-Package
        path: ${{ env.Wap_Project_Directory }}\AppPackages\**\*

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.Wap_Project_Directory }}/AppPackages/**/*.msix
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
